apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-demo.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-demo.labels" . | nindent 4 }}
    {{- include "sre-demo.backendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "sre-demo.backendLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "sre-demo.backendLabels" . | nindent 8 }}
        sre-demo/environment: {{ .Values.release.environment | quote }}
        sre-demo/git-sha: {{ .Values.release.gitSha | quote }}
        {{- if .Values.backend.azureMonitor.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        sre-demo/release-git-sha: {{ .Values.release.gitSha | quote }}
        sre-demo/image-digest: {{ .Values.release.imageDigest | quote }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sre-demo.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "sre-demo.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SRE_DEMO_ENVIRONMENT
              value: {{ .Values.release.environment | quote }}
            - name: SRE_DEMO_GIT_SHA
              value: {{ .Values.release.gitSha | quote }}
            - name: SRE_DEMO_IMAGE_DIGEST
              value: {{ .Values.release.imageDigest | quote }}
            - name: SRE_DEMO_SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: SRE_DEMO_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.backend.azureMonitor.enabled }}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{ .Values.backend.azureMonitor.connectionString | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
