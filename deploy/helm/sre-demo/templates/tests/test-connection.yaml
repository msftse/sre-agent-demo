apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sre-demo.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-demo.labels" . | nindent 4 }}
    {{- include "sre-demo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "sre-demo.serviceAccountName" . }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ include "sre-demo.image" .Values.trafficGenerator.image | quote }}
      imagePullPolicy: {{ .Values.trafficGenerator.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -ec
      args:
        - |
          curl --fail --silent http://backend:{{ .Values.backend.service.port }}/health/ready
          curl --fail --silent http://{{ include "sre-demo.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/healthz
          {{- if not .Values.trafficGenerator.enabled }}
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --header 'X-Operation-ID: helm-field20-recovery-{{ .Values.release.gitSha }}' \
            --data '{"email":"recovery-verifier@example.com","discount_code":"FIELD20","items":[{"product_id":"field-pack-28","quantity":2}]}' \
            --output /tmp/field20-checkout.json \
            http://{{ include "sre-demo.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/api/checkout
          grep -F '"subtotal_cents":29600' /tmp/field20-checkout.json
          grep -F '"discount_cents":5920' /tmp/field20-checkout.json
          grep -F '"shipping_cents":0' /tmp/field20-checkout.json
          grep -F '"total_cents":23680' /tmp/field20-checkout.json
          {{- end }}
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 8Mi
