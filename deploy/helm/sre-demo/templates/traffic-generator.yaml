{{- if .Values.trafficGenerator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-demo.fullname" . }}-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sre-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: traffic-generator
  template:
    metadata:
      labels:
        {{- include "sre-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: traffic-generator
    spec:
      serviceAccountName: {{ include "sre-demo.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-generator
          image: {{ include "sre-demo.image" .Values.trafficGenerator.image | quote }}
          imagePullPolicy: {{ .Values.trafficGenerator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
          args:
            - |
              while true; do
                if ! curl --fail --silent --show-error \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data '{"email":"{{ .Values.trafficGenerator.email }}","discount_code":"{{ .Values.trafficGenerator.discountCode }}","items":[{"product_id":"{{ .Values.trafficGenerator.productId }}","quantity":{{ .Values.trafficGenerator.quantity }}}]}' \
                  http://{{ include "sre-demo.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/api/checkout >/dev/null; then
                  printf '%s\n' 'checkout request failed as expected for the incident scenario'
                fi
                sleep {{ .Values.trafficGenerator.intervalSeconds }}
              done
          resources:
            {{- toYaml .Values.trafficGenerator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
{{- end }}
