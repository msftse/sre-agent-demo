name: Start Demo

run-name: Start Demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm direct publication of the intentional FIELD20 regression to main
        required: true
        type: boolean
        default: false

concurrency:
  group: demo-incident-setup
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  prepare:
    name: Publish incident and start delivery
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out protected baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify demo is idle and resolve latest fix
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active_prs=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number \
            --jq 'length')
          [[ "$active_prs" == 0 ]] || {
            printf 'A pull request is already open.\n' >&2
            exit 1
          }

          active_deliveries=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deliver-demo.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          [[ "$active_deliveries" == 0 ]] || {
            printf 'A demo delivery workflow is already active.\n' >&2
            exit 1
          }

          scenario_fix_sha=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --limit 100 \
            --json headRefName,mergedAt,mergeCommit \
            --jq '[.[] | select(.headRefName | startswith("sre/field20-checkout-"))]
              | sort_by(.mergedAt) | reverse | .[0].mergeCommit.oid // ""')
          [[ "$scenario_fix_sha" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'No merged SRE FIELD20 remediation PR was found.\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "$scenario_fix_sha" HEAD
          printf 'scenario_fix_sha=%s\n' "$scenario_fix_sha" >>"$GITHUB_OUTPUT"

      - name: Create intentional regression commit
        id: scenario
        env:
          SCENARIO_FIX_SHA: ${{ steps.baseline.outputs.scenario_fix_sha }}
        run: |
          git revert --no-commit "$SCENARIO_FIX_SHA"

          changed_files=$(git diff --cached --name-only)
          [[ "$changed_files" == $'src/backend/app/service.py\nsrc/backend/tests/test_api.py' ]] || {
            printf 'Scenario changed unexpected files:\n%s\n' "$changed_files" >&2
            exit 1
          }
          grep -F 'code="discount_calculation_failed"' src/backend/app/service.py >/dev/null
          if grep -F 'test_checkout_applies_valid_field20_discount' src/backend/tests/test_api.py >/dev/null; then
            printf 'The FIELD20 recovery test was not removed.\n' >&2
            exit 1
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/backend/app/service.py src/backend/tests/test_api.py
          git commit -m "test: activate FIELD20 incident"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: 3.12.13
          enable-cache: true

      - name: Validate intentional regression
        working-directory: src/backend
        run: |
          uv sync --locked --all-groups
          uv run ruff check .
          uv run mypy app tests
          uv run pytest

      - name: Push intentional regression to main
        env:
          GH_TOKEN: ${{ secrets.STAGE17_GITHUB_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            printf 'Repository secret STAGE17_GITHUB_TOKEN is required.\n' >&2
            exit 1
          }

          git fetch origin main
          [[ "$(git rev-parse HEAD^)" == "$(git rev-parse origin/main)" ]] || {
            printf 'main changed while the incident commit was prepared.\n' >&2
            exit 1
          }

          restore_protection() {
            ./scripts/configure-github-protection.sh incident-demo
          }
          trap restore_protection EXIT
          ./scripts/configure-github-protection.sh routine
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          restore_protection
          trap - EXIT

      - name: Restore incident protection
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.STAGE17_GITHUB_TOKEN }}
        run: ./scripts/configure-github-protection.sh incident-demo

      - name: Start incident delivery
        env:
          GH_TOKEN: ${{ secrets.STAGE17_GITHUB_TOKEN }}
          SCENARIO_SHA: ${{ steps.scenario.outputs.sha }}
        run: |
          gh workflow run deliver-demo.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f deploy=true \
            -f deploy_sha="$SCENARIO_SHA" \
            -f incident_traffic=true

      - name: Publish delivery checkpoint
        env:
          SCENARIO_SHA: ${{ steps.scenario.outputs.sha }}
        run: |
          {
            printf '## Demo incident published\n\n'
            printf -- '- Incident commit: %s\n' "$SCENARIO_SHA"
            printf -- '- The regression was validated and pushed directly to main.\n'
            printf -- '- Deliver Demo to AKS was dispatched with incident traffic enabled.\n'
            printf -- '- Azure Monitor and Azure SRE Agent take over after FIELD20 failures begin.\n'
            printf -- '- The later SRE remediation PR is the only PR and still requires human merge.\n'
          } >>"$GITHUB_STEP_SUMMARY"