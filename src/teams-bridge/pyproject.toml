[project]
name = "northstar-teams-bridge"
version = "0.1.0"
description = "Bidirectional Microsoft Teams bridge for the Azure SRE Agent demo."
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-data-tables==12.7.0",
    "azure-functions==1.23.0",
    "azure-functions-durable==1.4.0",
    "azure-identity==1.25.3",
    "httpx==0.28.1",
    "mcp==2.0.0",
    "microsoft-teams-apps==2.0.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bridge"]

[[tool.mypy.overrides]]
module = ["microsoft_teams.*"]
ignore_missing_imports = true